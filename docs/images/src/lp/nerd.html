<!doctype html>
<meta charset="utf-8">
<style>
@font-face { font-family:"KM"; src:url("../../../../dist/KusunokiMono-Regular.otf"); }
* { margin:0; padding:0; box-sizing:border-box; }
body {
  width:1240px; height:680px; background:#181825; color:#cdd6f4;
  padding:34px 56px; font-family:"KM", monospace; overflow:hidden;
  display:grid; grid-template-columns:repeat(2, minmax(0, 1fr));
  grid-template-rows:repeat(4, minmax(0, 1fr)); column-gap:64px; row-gap:18px;
}
.set { display:grid; grid-template-rows:18px minmax(0, 1fr); row-gap:8px; min-width:0; }
.name {
  font-family:-apple-system,BlinkMacSystemFont,sans-serif; color:#6c7086;
  font-size:12px; font-weight:600; letter-spacing:1px; line-height:18px;
}
.icons {
  display:grid; grid-template-columns:repeat(5, minmax(0, 1fr));
  grid-template-rows:repeat(2, minmax(0, 1fr));
  font-size:38px; line-height:1;
}
.icons span { display:grid; place-items:center; min-width:0; }
.powerline .icons { color:#cba6f7; }
.devicons .icons { color:#89b4fa; }
.seti .icons { color:#a6e3a1; }
.octicons .icons { color:#f9e2af; }
.awesome .icons { color:#fab387; }
.weather .icons { color:#74c7ec; }
.codicons .icons { color:#f38ba8; }
.material .icons { color:#94e2d5; }
</style>
<body>
<section class="set powerline">
  <div class="name">POWERLINE</div>
  <div class="icons"><span>&#xE0A0;</span><span>&#xE0A2;</span><span>&#xE0B0;</span><span>&#xE0B1;</span><span>&#xE0B2;</span><span>&#xE0B3;</span><span>&#xE0C8;</span><span>&#xE0CC;</span><span>&#xE0CE;</span><span>&#xE0D0;</span></div>
</section>
<section class="set devicons">
  <div class="name">DEVICONS</div>
  <div class="icons"><span>&#xE702;</span><span>&#xE704;</span><span>&#xE70E;</span><span>&#xE711;</span><span>&#xE712;</span><span>&#xE716;</span><span>&#xE719;</span><span>&#xE724;</span><span>&#xE76D;</span><span>&#xE7A8;</span></div>
</section>
<section class="set seti">
  <div class="name">SETI</div>
  <div class="icons"><span>&#xE5FF;</span><span>&#xE606;</span><span>&#xE609;</span><span>&#xE60C;</span><span>&#xE60D;</span><span>&#xE60E;</span><span>&#xE614;</span><span>&#xE61D;</span><span>&#xE61F;</span><span>&#xE620;</span></div>
</section>
<section class="set octicons">
  <div class="name">OCTICONS</div>
  <div class="icons"><span>&#xF400;</span><span>&#xF401;</span><span>&#xF405;</span><span>&#xF407;</span><span>&#xF408;</span><span>&#xF413;</span><span>&#xF417;</span><span>&#xF418;</span><span>&#xF41E;</span><span>&#xF427;</span></div>
</section>
<section class="set awesome">
  <div class="name">FONT AWESOME</div>
  <div class="icons"><span>&#xF002;</span><span>&#xF004;</span><span>&#xF005;</span><span>&#xF013;</span><span>&#xF015;</span><span>&#xF019;</span><span>&#xF023;</span><span>&#xF06B;</span><span>&#xF06E;</span><span>&#xF09B;</span></div>
</section>
<section class="set weather">
  <div class="name">WEATHER</div>
  <div class="icons"><span>&#xE300;</span><span>&#xE303;</span><span>&#xE305;</span><span>&#xE308;</span><span>&#xE30A;</span><span>&#xE30D;</span><span>&#xE312;</span><span>&#xE318;</span><span>&#xE31A;</span><span>&#xE31E;</span></div>
</section>
<section class="set codicons">
  <div class="name">CODICONS</div>
  <div class="icons"><span>&#xEA60;</span><span>&#xEA61;</span><span>&#xEA62;</span><span>&#xEA64;</span><span>&#xEA66;</span><span>&#xEA6D;</span><span>&#xEA75;</span><span>&#xEA81;</span><span>&#xEA84;</span><span>&#xEA85;</span></div>
</section>
<section class="set material">
  <div class="name">MATERIAL</div>
  <div class="icons"><span>&#xF0001;</span><span>&#xF0004;</span><span>&#xF0009;</span><span>&#xF001B;</span><span>&#xF001C;</span><span>&#xF001D;</span><span>&#xF0020;</span><span>&#xF0025;</span><span>&#xF0026;</span><span>&#xF0028;</span></div>
</section>
</body>
