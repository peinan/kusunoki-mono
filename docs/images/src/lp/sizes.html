<!doctype html>
<meta charset="utf-8">
<style>
@font-face { font-family:"KM"; src:url("../../../../dist/KusunokiMono-Regular.otf"); }
* { margin:0; padding:0; box-sizing:border-box; }
body {
  width:1240px; height:560px; background:#181825; color:#cdd6f4;
  padding:48px 56px; font-family:"KM", monospace; overflow:hidden;
  display:grid; grid-template-columns:max-content minmax(0, 1fr);
  align-content:center; align-items:center; column-gap:26px; row-gap:24px;
}
.row { display:contents; }
pre { font-family:inherit; font-size:var(--size); white-space:pre; line-height:1.4; }
.c { color:#6c7086; }
.badge {
  font-family:-apple-system,sans-serif; font-size:var(--size); font-weight:600;
  letter-spacing:.025em; text-align:center; justify-self:center;
  color:#7f849c;
}
.unit { color:#6c7086; font-size:.55em; font-weight:500; letter-spacing:0; margin-left:.08em; }
</style>
<body>
<div class="row" style="--size:22px"><div class="badge">11<span class="unit">px</span></div><pre>検索結果を並べ替える <span class="c">// 小さくても潰れない</span></pre></div>
<div class="row" style="--size:24px"><div class="badge">12<span class="unit">px</span></div><pre>検索結果を並べ替える <span class="c">// 小さくても潰れない</span></pre></div>
<div class="row" style="--size:28px"><div class="badge">14<span class="unit">px</span></div><pre>検索結果を並べ替える <span class="c">// 小さくても潰れない</span></pre></div>
<div class="row" style="--size:32px"><div class="badge">16<span class="unit">px</span></div><pre>検索結果を並べ替える <span class="c">// 小さくても潰れない</span></pre></div>
<div class="row" style="--size:40px"><div class="badge">20<span class="unit">px</span></div><pre>検索結果を並べ替える <span class="c">// 小さくても潰れない</span></pre></div>
</body>
